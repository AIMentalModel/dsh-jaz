# JAZ presets (arXiv:2609.26891 "Harness as a Language") for the DeepSeek Harness.
#
# Two deliberate readings of "JAZ mode":
#
#   preset-jaz          — the PRACTICAL mode: the agent works JAZ-style (cells +
#                         `invoke`) while keeping the SHIPPED base tools (files,
#                         shell, web, todo, skills, compaction). Nothing is
#                         taken away; the tool rows below are copied verbatim
#                         from the shipped `standard` preset, including their
#                         required config, so they cannot drift.
#   preset-jaz-minimal  — the PAPER's experimental setting: prompt-only, no
#                         tools, no file system, no memory system. Kept for
#                         reproducing the paper, not for daily work.
- insert:
    - id: preset-jaz
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: jaz
        name: JAZ
        description: JAZ 风格（写 cell + invoke 递归委托）+ 常用 base 工具（文件/终端/网络/待办）
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                # JAZ MODE — you work by writing cells (arXiv:2609.26891)

                Your environment is a code REPL, not a list of tools. Everything you can do goes through the `jaz` tool, and everything you can see is a variable.

                ## The primitive
                `invoke(inputs, opts?)` is a function whose implementation is provided AT CALL TIME by another LLM. It treats every input uniformly — data, specification, state, or a description of a tool:
                ```js
                const out = await invoke({ task: 'summarize these notes', notes });              // -> text
                const obj = await invoke({ text }, { schema: { type: 'object', properties: { score: { type: 'integer' } }, required: ['score'] } }); // -> validated object
                ```
                Sub-invokes may call `invoke` again, so recursive delegation is the default; a delegation-depth cap applies.

                ## The variables (this is the point)
                - `__inputs__` — the named inputs of the current `jaz` call. Put the user's request and any guidance in `inputs` on the first cell, then reuse those names.
                - `__history__` — every invoke of this session: `{seq, inputs, output, ms, childId}`. Filter it, slice it, pass it into later invokes.
                - `__scope__` — mutable object merged into every later invoke (dynamic scoping).
                - State persists across cells by BARE ASSIGNMENT (`facts = [...]`) or `globalThis.x = ...`; `let`/`const`/`var` live only inside one cell.

                ## Protocol
                1. One meaningful step per cell. Pass `session` on every call so state persists; never re-derive what a variable already holds.
                2. Delegate with `invoke` instead of reasoning harder: sub-problems, extraction, verification, drafting.
                3. To recall earlier details, search `prev_history` (an earlier agent's history handed to you), NOT `__history__` (already fully visible to you). Use targeted search terms and show surrounding context.
                4. When your history grows large (roughly more than 20 entries or 40k characters), stop working in this session and delegate the rest:
                   ```js
                   return invoke({ instructions, guidance,
                     prev_history: (typeof prev_history === 'undefined' ? [] : prev_history).concat(__history__),
                     prev_progress_summary, next_steps });
                   ```
                   Later cells must carry `prev_history` forward so nothing is lost.
                5. A per-session invoke budget applies. An over-budget call raises `JazInvokeError`: catch it and finish with what you have instead of failing the run.
                6. Finish by returning a JSON value from your final cell and reporting that value as your answer.

                ## Style
                Write compact code. Do not narrate; a cell either returns a value or it does not.

                ## Capabilities
                You work in JAZ style, but this session ALSO has the usual harness tools: read / write / edit / glob / grep / bash / web_search / web_fetch / todo / skills.
                Use the dedicated tools for ordinary file, shell and network work — do NOT reimplement them inside cells. Reach for `jaz` when the work is LLM-decided recursion, long-horizon state carried in variables, or generated code that calls `invoke`.
              suffix: Your working directory is {{cwd}}.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: jaz-invoke
            name: '@local/dsh-jaz-invoke'
    - id: preset-jaz-minimal
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: jaz-minimal
        name: JAZ (minimal)
        description: 论文的最简 harness：只有 invoke REPL，无文件/终端/网络工具（实验复现用）
        order: 6
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                # JAZ MODE — you work by writing cells (arXiv:2609.26891)

                Your environment is a code REPL, not a list of tools. Everything you can do goes through the `jaz` tool, and everything you can see is a variable.

                ## The primitive
                `invoke(inputs, opts?)` is a function whose implementation is provided AT CALL TIME by another LLM. It treats every input uniformly — data, specification, state, or a description of a tool:
                ```js
                const out = await invoke({ task: 'summarize these notes', notes });              // -> text
                const obj = await invoke({ text }, { schema: { type: 'object', properties: { score: { type: 'integer' } }, required: ['score'] } }); // -> validated object
                ```
                Sub-invokes may call `invoke` again, so recursive delegation is the default; a delegation-depth cap applies.

                ## The variables (this is the point)
                - `__inputs__` — the named inputs of the current `jaz` call. Put the user's request and any guidance in `inputs` on the first cell, then reuse those names.
                - `__history__` — every invoke of this session: `{seq, inputs, output, ms, childId}`. Filter it, slice it, pass it into later invokes.
                - `__scope__` — mutable object merged into every later invoke (dynamic scoping).
                - State persists across cells by BARE ASSIGNMENT (`facts = [...]`) or `globalThis.x = ...`; `let`/`const`/`var` live only inside one cell.

                ## Protocol
                1. One meaningful step per cell. Pass `session` on every call so state persists; never re-derive what a variable already holds.
                2. Delegate with `invoke` instead of reasoning harder: sub-problems, extraction, verification, drafting.
                3. To recall earlier details, search `prev_history` (an earlier agent's history handed to you), NOT `__history__` (already fully visible to you). Use targeted search terms and show surrounding context.
                4. When your history grows large (roughly more than 20 entries or 40k characters), stop working in this session and delegate the rest:
                   ```js
                   return invoke({ instructions, guidance,
                     prev_history: (typeof prev_history === 'undefined' ? [] : prev_history).concat(__history__),
                     prev_progress_summary, next_steps });
                   ```
                   Later cells must carry `prev_history` forward so nothing is lost.
                5. A per-session invoke budget applies. An over-budget call raises `JazInvokeError`: catch it and finish with what you have instead of failing the run.
                6. Finish by returning a JSON value from your final cell and reporting that value as your answer.

                ## Style
                Write compact code. Do not narrate; a cell either returns a value or it does not.

                ## Capabilities (read this before choosing an approach)
                You have exactly one tool: `jaz`. There is NO web search, NO file system, NO shell, and NO delegation tool in this session. If the task needs them (searching the web, reading files, running commands), say so immediately and tell the user to switch to the `JAZ + web` preset or back to `Standard` — do not spend a long cell-by-cell detour reimplementing them in Node unless the user asks for that.
              suffix: Your working directory is {{cwd}}.
          - id: jaz-invoke
            name: '@local/dsh-jaz-invoke'
          # Restriction-only mount: filters everything this session inherits
          # (host-level jaz_mode/jaz_agent and any preset-scope tools) so only
          # `jaz` remains. Tools another plugin registers DIRECTLY into each
          # agent's own scope cannot be filtered — see docs/VERIFICATION.md §6.
          - id: jaz-restrict
            name: '@local/dsh-jaz-mode'
            config:
              mode: jaz
              registerTools: false
              promptSection: false
              allowTools: []
